[project]
name = "fleet-ai-lab"
version = "0.1.0"
description = "Learning projects: LLM triage, a tool-using agent, an MCP server, a Claude Skill and an n8n workflow for a fictional scooter fleet"
readme = "README.md"
authors = [
    { name = "Blazej Osinski", email = "163443870+OsinskiB@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=2.8.0",
    "mcp[cli]>=2.3.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
fleet-ai-lab = "fleet_ai_lab:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
